<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 경비 정산 · 트립스플릿</title>
<meta name="description" content="여행 경비를 기록하고 N빵 정산까지 한 번에. 해외여행용 모바일 경비 노트.">
<meta name="theme-color" content="#FFF6F2">
<meta name="color-scheme" content="light">

<!-- 홈 화면에 추가했을 때 앱처럼 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="여행경비">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <main id="main" class="main">
    <section id="view-home" class="view" aria-label="지출 내역"></section>
    <section id="view-settle" class="view" aria-label="정산 결과" hidden></section>
    <section id="view-settings" class="view" aria-label="설정" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="주요 메뉴">
    <button class="tab" data-tab="home" type="button">
      <span class="tab-icon">🧾</span><span class="tab-label">내역</span>
    </button>
    <button class="tab tab-add" data-action="open-expense" type="button" aria-label="지출 추가">
      <span class="tab-plus">+</span>
    </button>
    <button class="tab" data-tab="settle" type="button">
      <span class="tab-icon">🧮</span><span class="tab-label">정산</span>
    </button>
    <button class="tab" data-tab="settings" type="button">
      <span class="tab-icon">⚙️</span><span class="tab-label">설정</span>
    </button>
  </nav>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="tripmath.js"></script>
<script src="app.js"></script>
</body>
</html>
